<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Biométrico</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.card{
    background:#111827;
    width:350px;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.icon{
    font-size:90px;
    margin-bottom:20px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#94a3b8;
    margin-bottom:25px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 22px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

#status{
    margin-top:20px;
    color:#cbd5e1;
}
</style>
</head>
<body>

<div class="card">

    <div class="icon">🖐️</div>

    <h1>Acceso Biométrico</h1>

    <p>
        Usa tu huella o reconocimiento facial
    </p>

    <button onclick="usarBiometria()">
        Continuar
    </button>

    <div id="status"></div>

</div>

<script>

async function usarBiometria(){

    const status = document.getElementById("status");

    if (!window.PublicKeyCredential) {
        status.innerHTML = "❌ Tu navegador no soporta biometría.";
        return;
    }

    try{

        status.innerHTML = "🔍 Esperando huella o rostro...";

        // Primero registramos una credencial
        const cred = await navigator.credentials.create({
            publicKey: {

                challenge: crypto.getRandomValues(new Uint8Array(32)),

                rp: {
                    name: "Sistema Biométrico"
                },

                user: {
                    id: crypto.getRandomValues(new Uint8Array(16)),
                    name: "usuario@test.com",
                    displayName: "Usuario"
                },

                pubKeyCredParams: [
                    {
                        type: "public-key",
                        alg: -7
                    }
                ],

                authenticatorSelection: {
                    authenticatorAttachment: "platform",
                    residentKey: "required",
                    requireResidentKey: true,
                    userVerification: "required"
                },

                timeout: 60000,
                attestation: "none"
            }
        });

        console.log("Credencial creada:", cred);

        status.innerHTML = "✅ Verificación biométrica completada.";

    }catch(error){

        console.error(error);

        status.innerHTML =
        "❌ Cancelaste o Windows pidió PIN.";
    }
}

</script>

</body>
</html>
